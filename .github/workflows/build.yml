name: Build macOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --config Release -j 4 2>&1 | tee build.log; then
            grep -E "error|Error|fatal" build.log | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit 1
          fi

      - name: Package
        run: |
          APP=$(find build -maxdepth 4 -name "*.app" -type d | head -1)
          echo "App: $APP"
          # Stable self-signed identity so macOS keeps privacy permissions between builds
          KC="$RUNNER_TEMP/flow.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import signing/flow-signing.p12 -P flow -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          HASH=4191F5A700DB032A3CD9711F1EDE0070DAA24AAE
          if codesign --force --deep --keychain "$KC" --sign "$HASH" "$APP" 2> sign.err; then
            echo "Signed with Flow Self-Signed"
          else
            echo "::warning::Self-signed failed: $(tr '\n' ' ' < sign.err | cut -c1-300) / $(security find-identity "$KC" | tr '\n' ' ' | cut -c1-200)"
            codesign --force --deep --sign - "$APP"
          fi
          codesign -dr - "$APP" || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Flow-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-macOS
          path: dist/Flow-macOS.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/Flow-macOS.zip \
            --title "Flow build ${{ github.run_number }}" \
            --notes "Apple Silicon (arm64). Self-signed app: right-click, Open the first time. Commit ${{ github.sha }}"

      - name: Keep only the latest 3 releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +4 | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
