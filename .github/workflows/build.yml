name: Build macOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --config Release -j 4 2>&1 | tee build.log; then
            grep -E "error|Error|fatal" build.log | head -10 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit 1
          fi

      - name: Package
        env:
          SIGNING_P12: ${{ secrets.FLOW_SIGNING_P12 }}
          SIGNING_PASS: ${{ secrets.FLOW_SIGNING_PASS }}
        run: |
          APP=$(find build -maxdepth 4 -name "*.app" -type d | head -1)
          echo "App: $APP"
          # Stable self-signed identity (kept in repository secrets, never in the repo) so macOS keeps privacy permissions between builds
          SIGNED=0
          if [ -n "$SIGNING_P12" ] && [ -n "$SIGNING_PASS" ]; then
            KC="$RUNNER_TEMP/flow.keychain-db"
            P12="$RUNNER_TEMP/flow-signing.p12"
            echo "$SIGNING_P12" | base64 --decode > "$P12"
            security create-keychain -p ci "$KC"
            security set-keychain-settings "$KC"
            security unlock-keychain -p ci "$KC"
            security import "$P12" -P "$SIGNING_PASS" -A -t cert -f pkcs12 -k "$KC"
            rm -f "$P12"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            HASH=$(security find-identity -p codesigning "$KC" | awk '/[0-9A-F]{40}/ {print $2; exit}')
            : > sign.err
            if [ -n "$HASH" ] && codesign --force --deep --keychain "$KC" --sign "$HASH" "$APP" 2> sign.err; then
              echo "Signed with Flow Self-Signed ($HASH)"
              SIGNED=1
            else
              echo "::warning::Self-signed failed: $(tr '\n' ' ' < sign.err | cut -c1-300)"
            fi
          else
            echo "::warning::Signing secrets FLOW_SIGNING_P12 / FLOW_SIGNING_PASS are not set: this build is not signed with the stable identity"
          fi
          if [ "$SIGNED" != "1" ]; then
            codesign --force --deep --sign - "$APP"
          fi
          codesign -dr - "$APP" || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Flow-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Flow-macOS
          path: dist/Flow-macOS.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/Flow-macOS.zip \
            --title "Flow build ${{ github.run_number }}" \
            --notes "Apple Silicon (arm64). Self-signed app: right-click, Open the first time. Commit ${{ github.sha }}"

      - name: Keep only the latest 3 releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +4 | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done
